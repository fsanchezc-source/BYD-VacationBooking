<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vacation Timeline</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f7f8fc; color: #1a1d2e; font-family: 'Inter', sans-serif; font-size: 13px; }

  header {
    background: #fff;
    border-bottom: 1px solid #e4e7f0;
    padding: 18px 28px;
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 50;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
  }
  header h1 { font-size: 18px; font-weight: 700; color: #1a1d2e; letter-spacing: -.01em; }
  header .sub { font-size: 11px; color: #9098b8; margin-top: 2px; }
  .pill { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:600; }
  #status-bar { display:flex; gap:10px; flex-wrap:wrap; margin-left:auto; }

  .toolbar {
    background: #fff;
    border-bottom: 1px solid #e4e7f0;
    padding: 10px 28px;
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .toolbar label { font-size: 11px; color: #9098b8; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; }
  select, input[type=text] {
    background: #f7f8fc; border: 1px solid #e4e7f0; color: #1a1d2e;
    font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 500;
    padding: 5px 10px; border-radius: 6px; outline: none;
    transition: border-color .15s;
  }
  select:focus, input:focus { border-color: #4f7ef8; }
  .sep { width:1px; height:20px; background:#e4e7f0; margin:0 4px; }

  .legend {
    background: #f7f8fc;
    border-bottom: 1px solid #e4e7f0;
    padding: 7px 28px;
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }
  .leg { display:flex; align-items:center; gap:5px; font-size:11px; color:#6b7494; font-weight:500; }
  .leg-dot { width:10px; height:10px; border-radius:3px; }

  .main { padding: 20px 28px 60px; }

  .team-block { margin-bottom: 24px; }
  .team-label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .team-badge { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 3px 10px; border-radius: 5px; color: #fff; }
  .agent-count { font-size: 11px; color: #9098b8; }

  .tl-wrap { background: #fff; border: 1px solid #e4e7f0; border-radius: 10px; overflow: hidden; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .tl-scroll { overflow-x: auto; }

  /* Past-entries collapsed row */
  .past-row-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 5px 14px; cursor: pointer;
    border-top: 1px solid #f0f2f8;
    background: #fafbff;
    font-size: 11px; color: #9098b8; font-weight: 500;
    user-select: none;
  }
  .past-row-btn:hover { background: #f0f2f8; }
  .past-rows-container { display: none; }
  .past-rows-container.open { display: contents; }

  #tt {
    position: fixed; z-index: 999;
    background: #fff; border: 1px solid #e4e7f0;
    border-radius: 10px; padding: 12px 15px;
    box-shadow: 0 6px 24px rgba(0,0,0,.12);
    font-size: 12px; pointer-events: none;
    opacity: 0; transition: opacity .1s;
    max-width: 240px;
  }
  #tt.on { opacity: 1; }
  #tt .r { display:flex; justify-content:space-between; gap:14px; margin-bottom:4px; }
  #tt .l { color:#9098b8; }
  #tt .v { font-weight:600; color:#1a1d2e; }

  #loading {
    position: fixed; inset: 0; background: rgba(247,248,252,.85);
    display: flex; align-items: center; justify-content: center;
    z-index: 200; font-size: 14px; color: #4f7ef8; font-weight: 600;
    display: none;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Vacation Planner</h1>
    <div class="sub" id="last-update">Loading data…</div>
  </div>
  <a href="https://forms.gle/JbvpTRP1sbSgUFfW7" target="_blank" style="display:inline-flex;align-items:center;gap:6px;background:#4f7ef8;color:#fff;font-size:12px;font-weight:600;padding:7px 14px;border-radius:7px;text-decoration:none;white-space:nowrap;transition:background .15s;" onmouseover="this.style.background='#2558e0'" onmouseout="this.style.background='#4f7ef8'">&#128197; Request or Cancel vacation</a>
  <div id="status-bar"></div>
</header>

<div class="toolbar">
  <label>Team</label>
  <select id="f-team" onchange="render()"><option value="">All</option></select>
  <div class="sep"></div>
  <label>Status</label>
  <select id="f-status" onchange="render()">
    <option value="">All</option>
    <option value="Confirmed">Confirmed</option>
    <option value="Waitlist">Waitlist</option>
    <option value="Cancelled">Cancelled</option>
  </select>
  <div class="sep"></div>
  <label>Agent</label>
  <input type="text" id="f-agent" placeholder="search…" oninput="render()" style="width:130px">
  <div class="sep"></div>
  <label>From</label>
  <input type="date" id="f-from" onchange="render()" style="width:130px">
  <label>To</label>
  <input type="date" id="f-to" onchange="render()" style="width:130px">
</div>

<div class="legend">
  <span style="font-size:10px;color:#9098b8;font-weight:600;text-transform:uppercase;letter-spacing:.06em">Status:</span>
  <div class="leg"><div class="leg-dot" style="background:#22c55e"></div>Confirmed</div>
  <div class="leg"><div class="leg-dot" style="background:#f97316"></div>Waitlist</div>
  <div class="leg"><div class="leg-dot" style="background:#ef4444"></div>Cancelled</div>
  <div class="leg"><div class="leg-dot" style="background:#4f7ef8;border-radius:50%"></div>Today</div>
</div>

<div class="main" id="main"></div>
<div id="tt"></div>
<div id="loading">Loading data…</div>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxFe9NBaQPWOLVWlkGvaYONMlMxd7sUlfZWcgmu76eG7UhDpcED5dIBBxkHN0-kzgqPAg/exec";
const AUTO_REFRESH_MINUTES = 1;
const TIMELINE_END = new Date(2026, 11, 20); // ← FECHA LÍMITE: meses 0-11 (9=octubre)
// ─────────────────────────────────────────────────────────────────────────────

let DATA = [];

const TEAM_COLORS = ['#4f7ef8','#9b5de5','#f72585','#06d6a0','#f97316','#00b4d8','#e11d48','#0891b2'];
const STATUS_STYLE = {
  'Confirmed':              {bg:'#f0fdf4', border:'#22c55e', color:'#15803d'},
  'Waitlist':               {bg:'#fff7ed', border:'#f97316', color:'#c2410c'},
  'Cancelled':              {bg:'#fef2f2', border:'#ef4444', color:'#b91c1c', strike:true},
  'Cancellation Processed': {bg:'#f8fafc', border:'#94a3b8', color:'#64748b', strike:true},
};

// ─── FETCH ───────────────────────────────────────────────────────────────────
async function loadData(silent=false) {
  if (!silent) showLoading(true);
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    showLoading(false);
    if (!json || !json.length) {
      document.getElementById('last-update').textContent = 'No data returned from sheet';
      return;
    }
    DATA = json.filter(r => r.email && r.start && r.end);
    DATA = addDisplayName(DATA);
    populateFilters();
    render();
    const now = new Date();
    document.getElementById('last-update').textContent =
      'Last updated: ' + now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) +
      ' · ' + DATA.length + ' requests';
  } catch(e) {
    showLoading(false);
    document.getElementById('last-update').textContent = 'Error: ' + e.message;
    console.error(e);
  }
}

function showLoading(on) {
  document.getElementById('loading').style.display = on ? 'flex' : 'none';
}

function addDisplayName(rows) {
  const nameMap = new Map();
  rows.forEach(r => { if(r.email) nameMap.set(r.email, r.agent); });
  return rows.map(r => ({ ...r, displayName: nameMap.get(r.email) || r.agent }));
}

// ─── FILTERS ─────────────────────────────────────────────────────────────────
function populateFilters() {
  const teams = [...new Set(DATA.map(d=>d.team))].sort();
  document.getElementById('f-team').innerHTML =
    '<option value="">All</option>' + teams.map(t=>`<option>${t}</option>`).join('');
}

function filtered() {
  const team   = document.getElementById('f-team').value;
  const status = document.getElementById('f-status').value;
  const agent  = document.getElementById('f-agent').value.toLowerCase();
  return DATA.filter(d =>
    (!team   || d.team===team) &&
    (!status || d.status===status) &&
    (!agent  || d.displayName.toLowerCase().includes(agent) || d.email.includes(agent))
  );
}

// ─── DATE UTILS ──────────────────────────────────────────────────────────────
function pd(s) {
  if (!s) return null;
  const p = s.split('/');
  if (p.length===3) return new Date(+p[2],+p[0]-1,+p[1]);
  const d = new Date(s); return isNaN(d)?null:d;
}
function diff(a,b) { return Math.round((b-a)/86400000); }

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const rows = filtered();
  const cont = document.getElementById('main');

  const total = rows.length;
  const conf  = rows.filter(r=>r.status==='Confirmed').length;
  const wait  = rows.filter(r=>r.status==='Waitlist').length;
  const canc  = rows.filter(r=>['Cancelled','Cancellation Processed'].includes(r.status)).length;
  document.getElementById('status-bar').innerHTML = `
    <div class="pill" style="background:#f1f5ff;color:#4f7ef8">${total} total</div>
    <div class="pill" style="background:#f0fdf4;color:#15803d">&#10003; ${conf} confirmed</div>
    <div class="pill" style="background:#fff7ed;color:#c2410c">&#9202; ${wait} waitlist</div>
    <div class="pill" style="background:#fef2f2;color:#b91c1c">&#10007; ${canc} cancelled</div>`;

  if (!rows.length) {
    cont.innerHTML = '<div style="padding:40px;color:#9098b8;text-align:center">No records match the filters.</div>';
    return;
  }

  // Date range: from pickers, defaulting to Jan 1 of current year → TIMELINE_END
  const today = new Date(); today.setHours(0,0,0,0);
  const fromInput = document.getElementById('f-from').value;
  const toInput   = document.getElementById('f-to').value;
  const rS = fromInput ? new Date(fromInput + 'T00:00:00') : new Date(today.getFullYear(), 0, 1);
  const rEraw = toInput   ? new Date(toInput   + 'T00:00:00') : TIMELINE_END;
  const rE = TIMELINE_END < rEraw ? TIMELINE_END : rEraw;
  const totalDays = diff(rS, rE) + 1;

  // Build months array
  const months = [];
  let mc = new Date(rS.getFullYear(), rS.getMonth(), 1);
  while(mc <= rE) { months.push(new Date(mc)); mc = new Date(mc.getFullYear(), mc.getMonth()+1, 1); }

  // Pixels per day — fixed 28px gives enough room to read week numbers
  const DW = 28;
  const LW = 190; // agent label column width

  const toPx = d => {
    const x = typeof d==='string' ? pd(d) : d;
    if(!x || x<rS) return 0;
    if(x>rE) return totalDays*DW;
    return diff(rS,x)*DW;
  };
  const wPx = (s,e) => {
    const ds=typeof s==='string'?pd(s):s, de=typeof e==='string'?pd(e):e;
    if(!ds||!de) return 0;
    const cs=ds<rS?rS:ds, ce=de>rE?rE:de;
    return Math.max(5, diff(cs,ce)*DW+DW);
  };
  const mPx = m => {
    const ms=new Date(m.getFullYear(),m.getMonth(),1), me=new Date(m.getFullYear(),m.getMonth()+1,0);
    const cs=ms<rS?rS:ms, ce=me>rE?rE:me;
    return (diff(cs,ce)+1)*DW;
  };
  const todayX = toPx(today);
  const teamW  = months.reduce((s,m)=>s+mPx(m), 0);

  // Build week tick marks within the visible range
  // Start from first Monday on or after rS
  function getWeekTicks() {
    const ticks = []; // {label, px}
    let d = new Date(rS);
    // Find first Monday
    while(d.getDay() !== 1) d = new Date(d.getTime()+86400000);
    while(d <= rE) {
      ticks.push({ px: toPx(d), day: d.getDate(), month: d.getMonth() });
      d = new Date(d.getTime() + 7*86400000);
    }
    return ticks;
  }
  const weekTicks = getWeekTicks();

  // Group by team → email
  const teams = {};
  rows.forEach(r => {
    if(!teams[r.team]) teams[r.team]={};
    if(!teams[r.team][r.email]) teams[r.team][r.email]=[];
    teams[r.team][r.email].push(r);
  });

  let html = '';
  let teamColorIdx = 0;

  Object.keys(teams).sort().forEach(team => {
    const accent = TEAM_COLORS[teamColorIdx++ % TEAM_COLORS.length];
    const agMap  = teams[team];
    const agKeys = Object.keys(agMap).sort((a,b) =>
      (agMap[a][0].displayName||a).localeCompare(agMap[b][0].displayName||b));

    // Show all agents always
    const futureAgents = agKeys;
    const pastAgents   = [];

    html += `<div class="team-block">
      <div class="team-label">
        <span class="team-badge" style="background:${accent}">${team}</span>
        <span class="agent-count">${agKeys.length} agent${agKeys.length>1?'s':''}</span>
      </div>
      <div class="tl-wrap"><div class="tl-scroll">
      <table style="border-collapse:collapse;width:max-content">
      <thead>`;

    // Month header row
    html += `<tr>
      <th style="width:${LW}px;min-width:${LW}px;background:#f7f8fc;border-bottom:1px solid #e4e7f0;position:sticky;left:0;z-index:11;padding:0 14px;height:28px;text-align:left;font-size:10px;font-weight:600;color:#9098b8;text-transform:uppercase;letter-spacing:.07em;"></th>`;
    months.forEach(m => {
      html += `<th colspan="1" style="width:${mPx(m)}px;min-width:${mPx(m)}px;background:#f7f8fc;border-bottom:1px solid #e4e7f0;border-left:2px solid #d0d5e8;height:28px;padding:0 0 0 6px;font-size:10px;font-weight:700;color:#6b7494;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;">${m.toLocaleDateString('en-US',{month:'short',year:'numeric'})}</th>`;
    });
    html += `</tr>`;

    // Week-day ruler row — single wide cell with absolute-positioned ticks
    html += `<tr>
      <th style="width:${LW}px;min-width:${LW}px;background:#f7f8fc;border-bottom:1px solid #e4e7f0;position:sticky;left:0;z-index:11;height:20px;"></th>
      <td colspan="${months.length}" style="position:relative;height:20px;background:#f7f8fc;border-bottom:1px solid #e4e7f0;border-left:1px solid #e4e7f0;width:${teamW}px;padding:0;">`;

    // Month separator lines on ruler
    let xo2 = 0;
    months.forEach((m,mi) => {
      if(mi>0) html += `<div style="position:absolute;left:${xo2}px;top:0;bottom:0;width:2px;background:#d0d5e8;pointer-events:none;z-index:1"></div>`;
      xo2 += mPx(m);
    });
    // Week ticks
    weekTicks.forEach(t => {
      html += `<div style="position:absolute;left:${t.px}px;top:0;bottom:0;width:1px;background:#e8eaf2;pointer-events:none;z-index:0"></div>
               <span style="position:absolute;left:${t.px+2}px;top:3px;font-size:9px;color:#b0b8d0;font-weight:600;white-space:nowrap;z-index:1">${t.day}</span>`;
    });
    // Today marker on ruler
    if(todayX>=0&&todayX<=teamW) {
      html += `<div style="position:absolute;left:${todayX}px;top:0;bottom:0;width:2px;background:#4f7ef8;opacity:.8;pointer-events:none;z-index:2"></div>`;
    }
    html += `</td></tr>`;
    html += `</thead><tbody>`;

    // Render agent rows
    const renderAgentRow = (emailKey, isLast) => {
      const entries = agMap[emailKey];
      const name = entries[0].displayName || entries[0].agent || emailKey;
      const initials = name.split(/[\s.]+/).map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'?';
      const bg = Object.keys(agMap).indexOf(emailKey)%2===0?'#fff':'#fafbff';

      // Lane calculation — only entries within visible range
      const LANE_H=22, BAR_H=18;
      const statusOrder={'Confirmed':0,'Waitlist':1,'Cancelled':2,'Cancellation Processed':3};
      const validE = entries
        .filter(e => { const ds=pd(e.start),de=pd(e.end); return ds&&de&&de>=rS&&ds<=rE; })
        .sort((a,b)=>(statusOrder[a.status]||0)-(statusOrder[b.status]||0));

      const lanesArr=[];
      const laneIdx=validE.map(e=>{
        const left=toPx(e.start), w=wPx(e.start,e.end), right=left+w;
        if(left>teamW) return -1;
        let li=0;
        while(true){
          if(!lanesArr[li]) lanesArr[li]=[];
          if(!lanesArr[li].some(([l,r])=>left<r&&right>l)){ lanesArr[li].push([left,right]); break; }
          li++;
        }
        return li;
      });
      const rowH = Math.max(40, (lanesArr.length||1)*LANE_H+8);

      let row = `<tr>
        <td style="width:${LW}px;min-width:${LW}px;height:${rowH}px;border-bottom:${isLast?'none':'1px solid #f0f2f8'};background:${bg};position:sticky;left:0;z-index:5;padding:0 14px;">
          <div style="display:flex;align-items:center;gap:8px;">
            <div style="width:26px;height:26px;border-radius:50%;background:${accent}20;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:${accent};flex-shrink:0;">${initials}</div>
            <div>
              <div style="font-size:12px;font-weight:500;color:#1a1d2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;">${name}</div>
              <div style="font-size:10px;color:#9098b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;">${emailKey}</div>
            </div>
          </div>
        </td>
        <td colspan="${months.length}" style="height:${rowH}px;border-bottom:${isLast?'none':'1px solid #f0f2f8'};border-left:1px solid #e4e7f0;position:relative;width:${teamW}px;padding:0;background:${bg};">`;

      // Month separator lines
      let xo=0;
      months.forEach((m,mi)=>{ if(mi>0) row+=`<div style="position:absolute;left:${xo}px;top:0;bottom:0;width:2px;background:#d0d5e8;pointer-events:none;z-index:0"></div>`; xo+=mPx(m); });

      // Week lines in row
      weekTicks.forEach(t => {
        row += `<div style="position:absolute;left:${t.px}px;top:0;bottom:0;width:1px;background:#eef0f8;pointer-events:none;z-index:0"></div>`;
      });

      // Today line
      if(todayX>=0&&todayX<=teamW) {
        row += `<div style="position:absolute;left:${todayX}px;top:0;bottom:0;width:2px;background:#4f7ef8;opacity:.6;pointer-events:none;z-index:3"></div>`;
      }

      // Bars
      validE.forEach((e, ei) => {
        const li = laneIdx[ei];
        if(li<0) return;
        const left=toPx(e.start), w=wPx(e.start,e.end);
        if(left>teamW) return;
        const top = 5+li*LANE_H;
        const d   = e.days || diff(pd(e.start),pd(e.end))+1;
        const st  = STATUS_STYLE[e.status]||STATUS_STYLE['Cancellation Processed'];
        const tip = encodeURIComponent(JSON.stringify({name,email:emailKey,team:e.team,start:e.start,end:e.end,status:e.status,days:d}));
        const strike = st.strike?'text-decoration:line-through;':'';
        row += `<div onmouseenter="showTip(event,'${tip}')" onmouseleave="hideTip()"
          style="position:absolute;left:${left}px;top:${top}px;width:${w}px;height:${BAR_H}px;border-radius:4px;display:flex;align-items:center;padding:0 6px;font-size:10px;font-weight:600;overflow:hidden;cursor:pointer;z-index:2;background:${st.bg};border:1.5px solid ${st.border};color:${st.color};${strike}"
        >${w>36?d+'d':''}</div>`;
      });

      row += `</td></tr>`;
      return row;
    };

    // Render future agents first
    futureAgents.forEach((emailKey, ai) => {
      html += renderAgentRow(emailKey, ai===futureAgents.length-1 && pastAgents.length===0);
    });

    // Past agents collapsed
    if(pastAgents.length > 0) {
      const btnId = 'past_'+team.replace(/\W/g,'_');
      html += `<tr><td colspan="${months.length+1}" style="padding:0;border-top:1px solid #f0f2f8;">
        <div class="past-row-btn" onclick="togglePast('${btnId}')">
          <span id="${btnId}_icon">▶</span>
          <span>${pastAgents.length} agent${pastAgents.length>1?'s':''} with no upcoming requests (click to expand)</span>
        </div>
      </td></tr>`;
      html += `<tbody id="${btnId}" class="past-rows-container">`;
      pastAgents.forEach((emailKey, ai) => {
        html += renderAgentRow(emailKey, ai===pastAgents.length-1);
      });
      html += `</tbody>`;
    }

    html += `</tbody></table></div></div></div>`;
  });

  cont.innerHTML = html;
}

function togglePast(id) {
  const el = document.getElementById(id);
  const icon = document.getElementById(id+'_icon');
  if(el.classList.contains('open')) {
    el.classList.remove('open');
    icon.textContent = '▶';
  } else {
    el.classList.add('open');
    icon.textContent = '▼';
  }
}

// ─── TOOLTIP ─────────────────────────────────────────────────────────────────
const tt = document.getElementById('tt');
function showTip(e, enc) {
  const d = JSON.parse(decodeURIComponent(enc));
  const st = STATUS_STYLE[d.status]||STATUS_STYLE['Cancellation Processed'];
  tt.innerHTML=`
    <div style="font-weight:700;font-size:13px;margin-bottom:8px">${d.name}</div>
    <div class="r"><span class="l">Email</span><span class="v" style="font-size:11px">${d.email}</span></div>
    <div class="r"><span class="l">Team</span><span class="v">${d.team}</span></div>
    <div class="r"><span class="l">From</span><span class="v">${d.start}</span></div>
    <div class="r"><span class="l">To</span><span class="v">${d.end}</span></div>
    <div class="r"><span class="l">Days</span><span class="v">${d.days}</span></div>
    <div style="margin-top:8px;padding:3px 9px;border-radius:5px;font-size:11px;font-weight:600;display:inline-block;background:${st.bg};border:1.5px solid ${st.border};color:${st.color}">${d.status}</div>`;
  tt.classList.add('on');
  mv(e);
}
function mv(e) {
  let x=e.clientX+14,y=e.clientY+14;
  if(x+250>window.innerWidth) x=e.clientX-254;
  if(y+200>window.innerHeight) y=e.clientY-204;
  tt.style.left=x+'px'; tt.style.top=y+'px';
}
function hideTip() { tt.classList.remove('on'); }
document.addEventListener('mousemove', e=>{ if(tt.classList.contains('on')) mv(e); });
window.addEventListener('resize', ()=>{ if(DATA.length) render(); });

// Set default date range: Jan 1 of current year → TIMELINE_END
(function() {
  const today = new Date();
  const fromDefault = today.getFullYear() + '-01-01';
  const toDefault   = TIMELINE_END.getFullYear() + '-' +
    String(TIMELINE_END.getMonth()+1).padStart(2,'0') + '-' +
    String(TIMELINE_END.getDate()).padStart(2,'0');
  document.getElementById('f-from').value = fromDefault;
  document.getElementById('f-to').value   = toDefault;
})();

loadData();
setInterval(()=>loadData(true), AUTO_REFRESH_MINUTES * 60 * 1000);
</script>
</body>
</html>
